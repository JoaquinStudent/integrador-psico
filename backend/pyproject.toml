[project]
name = "psicograma-backend"
version = "0.1.0"
description = "API de Psicograma — arquitectura hexagonal sobre FastAPI"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    # ponytail: httpx en vez de los SDK de openai/openrouter. Son dos POST con
    # JSON; el SDK anade superficie y version que mantener para nada.
    "httpx>=0.28",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# WeasyPrint necesita librerias del sistema (pango, cairo). Se instala aparte para
# que el backend siga arrancando en una maquina sin ellas.
pdf = ["weasyprint>=63"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psicograma"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Un solo event loop para toda la corrida. El engine es de modulo, y asyncpg ata
# sus conexiones al loop que las creo: con un loop por test, una conexion que
# cruza de loop no falla, se cuelga. Los tests de dominio no usan red y no se
# ven afectados.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# El dominio no importa infraestructura. Ruff lo verifica ademas del script, para
# que falle en el editor y no solo en CI.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "El dominio no puede importar FastAPI. Va en adapter/inbound/http/."
"sqlalchemy".msg = "El dominio no puede importar SQLAlchemy. Va en adapter/outbound/postgres/."
